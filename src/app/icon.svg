<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- anodized titanium: purple-blue body with a cool highlight -->
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3d3fae"/>
      <stop offset="0.35" stop-color="#8f96ff"/>
      <stop offset="0.55" stop-color="#5a62dc"/>
      <stop offset="1" stop-color="#2c2b86"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4b3fb8"/>
      <stop offset="0.35" stop-color="#a59cff"/>
      <stop offset="0.6" stop-color="#6a55e0"/>
      <stop offset="1" stop-color="#33278f"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#141414"/>
  <g transform="translate(32 32) scale(1.17) rotate(38) translate(-32 -31)">
    <!-- threaded shank with serrated edges -->
    <path fill="url(#metal)" d="
      M26 22 H38
      L38 24 L39.6 26 L38 28 L39.6 30 L38 32 L39.6 34 L38 36 L39.6 38 L38 40 L39.6 42 L38 44 L39.6 46 L38 48 L39.6 50 L38 52
      L36 55 H28 L26 52
      L24.4 50 L26 48 L24.4 46 L26 44 L24.4 42 L26 40 L24.4 38 L26 36 L24.4 34 L26 32 L24.4 30 L26 28 L24.4 26 L26 24 Z"/>
    <!-- thread roots -->
    <g stroke="#1c1a5a" stroke-width="1.1" stroke-linecap="round" opacity="0.75">
      <path d="M26 27 L38 25"/><path d="M26 31 L38 29"/><path d="M26 35 L38 33"/>
      <path d="M26 39 L38 37"/><path d="M26 43 L38 41"/><path d="M26 47 L38 45"/>
      <path d="M26 51 L38 49"/>
    </g>
    <!-- flange -->
    <rect x="18.5" y="18" width="27" height="4.5" rx="1.6" fill="url(#head)"/>
    <!-- 12-point head with flutes -->
    <path fill="url(#head)" d="M21.5 18 V9.5 Q21.5 6 25 6 H39 Q42.5 6 42.5 9.5 V18 Z"/>
    <g fill="#241c6e" opacity="0.8">
      <rect x="24.6" y="8" width="2.2" height="10" rx="1.1"/>
      <rect x="30.9" y="8" width="2.2" height="10" rx="1.1"/>
      <rect x="37.2" y="8" width="2.2" height="10" rx="1.1"/>
    </g>
    <!-- top chamfer highlight -->
    <rect x="23" y="6.4" width="18" height="1.4" rx="0.7" fill="#d6d3ff" opacity="0.55"/>
  </g>
</svg>
